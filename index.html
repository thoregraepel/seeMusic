<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>seeMusic</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
</head>
<body>
  <div id="overlay">
    <div id="overlay-content">
      <h2>seeMusic</h2>
      <p>Click to start audio</p>
    </div>
  </div>

  <div id="app">
    <header>
      <div id="header-row1">
        <h1>seeMusic</h1>
        <div id="controls">
          <select id="file-select"></select>
          <label id="upload-label">
            Load MIDI
            <input type="file" id="file-input" accept=".mid,.midi">
          </label>
          <button id="btn-play">▶ Play</button>
          <button id="btn-stop">■ Stop</button>
        </div>
        <div id="toggles">
          <button id="btn-audio" class="toggle active">Audio: ON</button>
          <button id="btn-visual" class="toggle active">Visual: ON</button>
          <button id="btn-color" class="toggle">Color: OFF</button>
          <button id="btn-hyp" class="toggle">Hyp: OFF</button>
          <button id="btn-sync" class="toggle">Sync: OFF</button>
          <button id="btn-fullscreen" class="toggle">⛶ Fullscreen</button>
        </div>
      </div>
      <div id="header-row2">
        <div class="ctrl-group">
          <label for="sf-scale">SF Scale</label>
          <input type="range" id="sf-scale" min="-2" max="2" step="0.05" value="0">
          <span id="sf-scale-display">1.00×</span>
        </div>
        <div class="ctrl-group">
          <label for="waveform-select">Waveform</label>
          <select id="waveform-select">
            <option value="sine">Sine</option>
            <option value="square">Square</option>
            <option value="triangle">Triangle</option>
            <option value="sawtooth">Sawtooth</option>
          </select>
        </div>
        <div class="ctrl-group">
          <label for="render-mode-select">Mode</label>
          <select id="render-mode-select">
            <option value="circles">Circles</option>
            <option value="grid">Grid</option>
          </select>
        </div>
        <div class="ctrl-group">
          <label for="super-select">Superposition</label>
          <select id="super-select">
            <option value="sum">Sum</option>
            <option value="product">Product</option>
            <option value="max">Max</option>
          </select>
        </div>
        <div class="ctrl-group">
          <label for="tilt">Tilt</label>
          <input type="range" id="tilt" min="-2" max="2" step="0.1" value="0">
          <span id="tilt-display">0.0</span>
        </div>
        <div class="ctrl-group">
          <label for="visual-lead">Visual lead</label>
          <input type="range" id="visual-lead" min="0" max="100" step="1" value="22">
          <span id="visual-lead-display">22 ms</span>
        </div>
      </div>
    </header>

    <main>
      <canvas id="grating-canvas"></canvas>
      <div id="sync-panel"></div>
    </main>

    <footer>
      <div id="progress-wrap">
        <span id="time-display">0:00 / 0:00</span>
        <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
      </div>
      <div id="info">
        <span id="key-display">Key: —</span>
        <span id="notes-display">Notes: —</span>
      </div>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
